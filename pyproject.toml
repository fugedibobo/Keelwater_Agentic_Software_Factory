[project]
name = "keelwater"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "openai", "httpx", "pydantic>=2,<3", "pyyaml", "jsonschema",
  "python-dotenv", "fastapi", "uvicorn", "jinja2", "numpy", "scipy",
]

[dependency-groups]
dev = ["pytest"]

[project.scripts]
keelwater = "signal_engine.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["signal_engine", "generator"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider --basetemp=.scratch/pytest"
markers = ["live: needs a real key; run with --live"]
